<!doctype html>
<html lang="en" data-brand-fonts data-composition-variables='[{"id":"headline","type":"string","group":"Content","label":"Headline","default":"A smaller team. A bigger impact."},{"id":"summary","type":"string","group":"Content","label":"Story","default":"One reusable production system. More time for the work that matters."},{"id":"metrics","multiline":true,"type":"string","group":"Content","label":"Key results","default":"Hours saved|24\nAssets created|36\nProduction time|-40%","ui":"metrics","maxItems":3},{"id":"imageList","multiline":true,"type":"string","group":"Content","label":"Gallery images","default":"assets/flow.svg\nassets/orbit.svg\nassets/grid.svg","ui":"image-list","maxItems":6},{"id":"layout","type":"enum","group":"Layout","label":"Slide layout","default":"overview","options":[{"value":"overview","label":"Overview"},{"value":"results","label":"Results"},{"value":"gallery","label":"Gallery"}]},{"id":"showSummary","type":"boolean","group":"Layout","label":"Show story","default":true},{"id":"headingFont","type":"font","group":"Brand","label":"Heading font","default":""},{"id":"accentColor","type":"color","group":"Brand","label":"Primary","brandKey":"accent","default":"#2453ff"},{"id":"secondaryColor","type":"color","group":"Brand","label":"Secondary","brandKey":"accentSoft","default":"#5c7cff"},{"id":"paper","type":"color","group":"Brand","label":"Paper","brandKey":"paper","default":"#f6f7f9"},{"id":"ink","type":"color","group":"Brand","label":"Text","brandKey":"ink","default":"#16181d"},{"id":"backgroundImage","type":"string","group":"Background","label":"Background image (optional)","default":""}]'>
<head><meta charset="utf-8"><title>Case Study {{LABEL}}</title><style>
*{box-sizing:border-box}body{margin:0}#root{width:{{WIDTH}}px;height:{{HEIGHT}}px;position:relative;overflow:hidden;background:var(--paper,#f6f7f9);color:var(--ink,#16181d);font-family:var(--sans,Arial)}
.bg{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.16}.page{position:absolute;inset:0;padding:7%;display:flex;flex-direction:column;gap:3%}.eyebrow{font-size:22px;letter-spacing:.15em;color:var(--accentColor);font-weight:700}h1{font-size:clamp(48px,7vw,84px);line-height:1.02;letter-spacing:-.045em;margin:0;max-width:100%;overflow-wrap:anywhere}p{font-size:28px;line-height:1.4;margin:0;max-height:22%;overflow:hidden}.content{display:flex;flex-direction:column;gap:24px;flex:1;min-height:0}.gallery{display:grid;gap:14px;flex:1;min-height:0}.gallery img{width:100%;height:100%;min-height:0;object-fit:cover;border-radius:24px}.metrics{display:flex;gap:18px;flex-wrap:wrap}.metric{background:var(--ink);color:var(--paper);border-radius:24px;padding:26px;flex:1;min-width:180px}.metric strong{display:block;font-size:52px;letter-spacing:-.04em;overflow-wrap:anywhere}.metric span{display:block;font-size:20px;margin-top:12px}.footer{font-size:18px;border-top:2px solid var(--accentColor);border-image:linear-gradient(90deg,var(--accentColor),var(--secondaryColor)) 1;padding-top:20px}#root.results .metrics{flex:1;flex-direction:column}#root.results .metric{display:flex;align-items:center;justify-content:space-between;gap:24px}
</style></head><body><div id="root" data-composition-id="case-study" data-start="0" data-duration="0" data-width="{{WIDTH}}" data-height="{{HEIGHT}}"><img class="bg" id="bg" alt=""><main class="page"><div class="eyebrow">THE PRODUCTION PLAYBOOK</div><h1 id="title"></h1><p id="story"></p><div class="content"><div class="gallery" id="gallery"></div><div class="metrics" id="metrics"></div></div><div class="footer">ILLUSTRATIVE RESULTS / REPLACE WITH YOUR OWN DATA</div></main></div><script>
const v=window.__hyperframes?.getVariables?.() ?? window.__studio?.getVariables?.() ?? {};
const root=document.getElementById('root');
for(const k of ['paper','ink','accentColor','secondaryColor']) if(v[k]) root.style.setProperty('--'+k,v[k]);
root.classList.add(['overview','results','gallery'].includes(v.layout)?v.layout:'overview');
const title=document.getElementById('title');title.textContent=v.headline ?? 'A smaller team. A bigger impact.';if(v.headingFont)title.style.fontFamily=v.headingFont;
const story=document.getElementById('story');story.textContent=v.summary ?? '';if(v.showSummary===false||v.showSummary==='false')story.remove();
const bg=document.getElementById('bg');if(v.backgroundImage)bg.src=v.backgroundImage;else bg.remove();
const gallery=document.getElementById('gallery');
const images=String(v.imageList??'assets/flow.svg\nassets/orbit.svg\nassets/grid.svg').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,6);
if(v.layout==='results'||!images.length)gallery.remove();else{gallery.style.gridTemplateColumns=`repeat(${images.length===1?1:images.length===3?3:2},minmax(0,1fr))`;for(const [index,src] of images.entries()){const img=document.createElement('img');img.dataset.studioImage='imageList';img.dataset.studioIndex=String(index);img.src=src;img.alt='';gallery.append(img)}}
const metrics=document.getElementById('metrics');if(v.layout==='gallery')metrics.remove();else for(const line of String(v.metrics??'').split(/\r?\n/).filter(Boolean).slice(0,3)){const [label,...value]=line.split('|');const card=document.createElement('div');card.className='metric';const n=document.createElement('strong');n.textContent=value.join('|');const l=document.createElement('span');l.textContent=label;card.append(n,l);metrics.append(card)}
// Choose a grid that gives each landscape image the largest useful cell.
if(gallery.isConnected && images.length){
 const w=gallery.clientWidth,h=gallery.clientHeight;let best=0,cols=1;
 for(let c=1;c<=images.length;c++){const rows=Math.ceil(images.length/c);const score=Math.min((w-14*(c-1))/c,(h-14*(rows-1))/rows/.6);if(score>best){best=score;cols=c}}
 gallery.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
 gallery.style.gridTemplateRows=`repeat(${Math.ceil(images.length/cols)},minmax(0,1fr))`;
}
// Bound headline height so long briefs remain inside the page.
while(title.offsetHeight>root.clientHeight*.24 && parseFloat(getComputedStyle(title).fontSize)>32)title.style.fontSize=(parseFloat(getComputedStyle(title).fontSize)-2)+'px';
</script></body></html>
