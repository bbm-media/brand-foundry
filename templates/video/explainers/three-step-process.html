<!doctype html>
<html lang="en" data-brand-fonts data-composition-variables='[{"id":"eyebrow","type":"string","label":"Category","default":"THE PRODUCTION LOOP","group":"Content"},{"id":"headline","type":"string","label":"Headline","default":"One idea. Three useful steps.","group":"Content"},{"id":"step1","type":"string","label":"Step 1","default":"Research","group":"Content"},{"id":"detail1","type":"string","label":"Step 1 description","default":"Find the question your audience needs answered.","group":"Content"},{"id":"step2","type":"string","label":"Step 2","default":"Record","group":"Content"},{"id":"detail2","type":"string","label":"Step 2 description","default":"Explain it once, clearly and in your own voice.","group":"Content"},{"id":"step3","type":"string","label":"Step 3","default":"Repurpose","group":"Content"},{"id":"detail3","type":"string","label":"Step 3 description","default":"Turn that recording into useful clips and posts.","group":"Content"},{"id":"footer","type":"string","label":"Closing line","default":"A repeatable workflow for your team.","group":"Content"},{"id":"accentColor","type":"color","label":"Accent","default":"#2453ff","brandKey":"accent","group":"Brand"},{"id":"secondaryColor","type":"color","label":"Secondary","default":"#5c7cff","brandKey":"accentSoft","group":"Brand"},{"id":"bgColor","type":"color","label":"Background","default":"#F6F7F9","brandKey":"paper","group":"Brand"},{"id":"textColor","type":"color","label":"Text","default":"#16181d","brandKey":"ink","group":"Brand"},{"id":"cardColor","type":"color","label":"Cards","default":"#16181d","brandKey":"ink","group":"Brand"},{"id":"cardText","type":"color","label":"Card text","default":"#F6F7F9","brandKey":"paper","group":"Brand"},{"id":"backgroundImage","type":"string","label":"Background image","default":"","group":"Background","description":"Optional image behind the graphic. Leave blank for the solid background."},{"id":"durationSeconds","type":"number","label":"Video length (seconds)","group":"Timing","default":8,"min":2,"max":120,"step":0.5},{"id":"entranceSeconds","type":"number","label":"Animate in (seconds)","group":"Timing","default":1.4,"min":0.2,"max":10,"step":0.1},{"id":"exitSeconds","type":"number","label":"Animate out (seconds)","group":"Timing","default":0.5,"min":0,"max":10,"step":0.1},{"id":"headingFont","type":"font","label":"Heading font","group":"Brand","default":"","description":"Use the studio heading font, or choose another font for this asset."}]'>
<head><meta charset="utf-8"><meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}"><title>Three Step Process {{LABEL}}</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0}#root{position:relative;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;background:var(--bgColor);color:var(--textColor);font-family:var(--sans,Arial,sans-serif)}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.2}.scene{position:absolute;inset:0}.eyebrow{font-size:22px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.heading{font-family:var(--serif,Georgia,serif);font-weight:600;line-height:1.06;letter-spacing:-.035em;overflow-wrap:anywhere;margin:0}.small{font-size:26px;line-height:1.4}.fine{font-size:19px;line-height:1.4;letter-spacing:.035em}h2,p{margin:0}
.artwork{position:absolute;inset:0;padding:7%;display:flex;flex-direction:column;justify-content:center;gap:46px}.eyebrow{color:var(--accentColor)}.heading{font-size:78px;margin-top:26px;max-width:1450px}.steps{display:grid;grid-template-columns:1fr;gap:24px}.step{position:relative;background:var(--cardColor);color:var(--cardText);padding:36px 40px;border-radius:20px;display:grid;grid-template-columns:94px 1fr;gap:28px;align-items:center;min-height:238px}.badge{height:80px;width:80px;border:2px solid var(--accentColor);color:var(--cardText);font-size:36px;font-weight:700;border-radius:50%;display:grid;place-items:center}.step h2{font-size:44px;line-height:1.15;letter-spacing:-.03em;margin-bottom:16px;overflow-wrap:anywhere}.step p{font-size:26px;line-height:1.4;opacity:.8;overflow-wrap:anywhere}.progress{height:5px;background:linear-gradient(90deg,var(--accentColor),var(--secondaryColor));border-radius:4px}.closing{font-size:26px;line-height:1.35;opacity:.7}html[data-size=wide] .steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}html[data-size=wide] .step{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;min-height:348px;padding:34px}html[data-size=wide] .heading{font-size:85px}html[data-size=wide] .step h2{font-size:40px}html[data-size=wide] .step p{font-size:25px}html[data-size=half] .artwork{gap:28px}html[data-size=half] .step{min-height:205px;padding:28px 34px}html[data-size=half] .heading{font-size:68px}</style></head><body>
<div id="root" data-composition-id="three-step-process" data-start="0" data-duration="8" data-duration-var="durationSeconds" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
<img id="background" class="background" data-var-src="backgroundImage" alt="">
<section id="three-step-process-scene" class="scene clip" data-start="0" data-duration="8" data-duration-var="durationSeconds" data-track-index="1"><div class="artwork"><header class="intro"><div class="eyebrow" data-var-text="eyebrow" data-optional="eyebrow">THE PRODUCTION LOOP</div><h1 class="heading" data-var-text="headline">One idea. Three useful steps.</h1></header><div class="progress"></div><div class="steps"><article class="step"><div class="badge">01</div><div><h2 data-var-text="step1"></h2><p data-var-text="detail1" data-optional="detail1"></p></div></article><article class="step"><div class="badge">02</div><div><h2 data-var-text="step2"></h2><p data-var-text="detail2" data-optional="detail2"></p></div></article><article class="step"><div class="badge">03</div><div><h2 data-var-text="step3"></h2><p data-var-text="detail3" data-optional="detail3"></p></div></article></div><div class="closing" data-var-text="footer" data-optional="footer">A repeatable workflow for your team.</div></div></section></div>
<script>
const vars=window.__hyperframes?.getVariables?.() ?? window.__studio?.getVariables?.() ?? {};
const root=document.getElementById('root');
const defaults={"eyebrow":"THE PRODUCTION LOOP","headline":"One idea. Three useful steps.","step1":"Research","detail1":"Find the question your audience needs answered.","step2":"Record","detail2":"Explain it once, clearly and in your own voice.","step3":"Repurpose","detail3":"Turn that recording into useful clips and posts.","footer":"A repeatable workflow for your team.","accentColor":"#2453ff","secondaryColor":"#5c7cff","bgColor":"#F6F7F9","textColor":"#16181d","cardColor":"#16181d","cardText":"#F6F7F9"};
const value=id=>vars[id] ?? defaults[id] ?? '';
document.querySelectorAll('[data-var-text]').forEach(el=>{el.textContent=String(value(el.dataset.varText));});
for(const key of ['bgColor','textColor','accentColor','secondaryColor','cardColor','cardText'])if(value(key))root.style.setProperty('--'+key,value(key));
if(vars.headingFont)root.style.setProperty('--serif',vars.headingFont);
if(!String(vars.backgroundImage??'').trim())document.getElementById('background').remove();
document.querySelectorAll('[data-optional]').forEach(el=>{if(!String(value(el.dataset.optional)).trim())el.remove();});

const total=Math.max(2,Math.min(120,Number(vars.durationSeconds)||8));
const enter=Math.min(total*.45,Math.max(.2,Number(vars.entranceSeconds)||1.4));
const exit=Math.min(total*.45,Math.max(0,Number(vars.exitSeconds)||0));
root.dataset.posterTime=String(total-exit-.05);
const tl=gsap.timeline({paused:true});
tl.from('.intro',{y:25,opacity:0,duration:.55,ease:'power3.out'},0).from('.progress',{scaleX:0,transformOrigin:'left center',duration:.85,ease:'power2.inOut'},.15).from('.step',{y:40,opacity:0,stagger:.22,duration:.6,ease:'power3.out'},.3);if(document.querySelector('.closing'))tl.from('.closing',{y:15,opacity:0,duration:.4},1.1);
const original=tl.duration();
tl.getChildren().forEach(t=>{t.startTime(t.startTime()*enter/original);t.duration(t.duration()*enter/original);});
if(exit)tl.to('.artwork',{opacity:0,y:-12,duration:exit,ease:'power2.in'},total-exit);
tl.to({},{duration:.001},total-.001);
window.__timelines=window.__timelines||{};window.__timelines['three-step-process']=tl;
</script></body></html>
