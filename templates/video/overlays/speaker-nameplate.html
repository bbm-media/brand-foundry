<!doctype html>
<html lang="en" data-brand-fonts data-composition-variables='[{"id":"speakerName","type":"string","label":"Speaker name","default":"Your name","group":"Content"},{"id":"role","type":"string","label":"Role or title","default":"Founder & creative director","group":"Content"},{"id":"company","type":"string","label":"Company or handle","default":"Your company","group":"Content"},{"id":"initials","type":"string","label":"Initials","default":"YN","group":"Content","description":"Two letters shown when no portrait is uploaded."},{"id":"portraitImage","type":"string","label":"Portrait photo","default":"","group":"Content","description":"Optional speaker photo. Click its preview to replace it."},{"id":"alignment","type":"enum","group":"Layout","label":"Position","default":"left","options":[{"value":"left","label":"Bottom left"},{"value":"right","label":"Bottom right"}]},{"id":"accentColor","type":"color","label":"Accent","default":"#2453ff","brandKey":"accent","group":"Brand"},{"id":"bgColor","type":"color","label":"Canvas","default":"#F6F7F9","brandKey":"paper","group":"Brand"},{"id":"textColor","type":"color","label":"Canvas text","default":"#16181d","brandKey":"ink","group":"Brand"},{"id":"cardColor","type":"color","label":"Nameplate","default":"#16181d","brandKey":"ink","group":"Brand"},{"id":"cardText","type":"color","label":"Nameplate text","default":"#F6F7F9","brandKey":"paper","group":"Brand"},{"id":"backgroundImage","type":"string","label":"Background image","default":"","group":"Background","description":"Optional image behind the graphic. Leave blank for the solid background."},{"id":"durationSeconds","type":"number","label":"Video length (seconds)","group":"Timing","default":6,"min":2,"max":120,"step":0.5},{"id":"entranceSeconds","type":"number","label":"Animate in (seconds)","group":"Timing","default":1.4,"min":0.2,"max":10,"step":0.1},{"id":"exitSeconds","type":"number","label":"Animate out (seconds)","group":"Timing","default":0.5,"min":0,"max":10,"step":0.1},{"id":"headingFont","type":"font","label":"Heading font","group":"Brand","default":"","description":"Use the studio heading font, or choose another font for this asset."}]'>
<head><meta charset="utf-8"><meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}"><title>Speaker Nameplate {{LABEL}}</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0}#root{position:relative;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;background:var(--bgColor);color:var(--textColor);font-family:var(--sans,Arial,sans-serif)}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.2}.scene{position:absolute;inset:0}.eyebrow{font-size:22px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.heading{font-family:var(--serif,Georgia,serif);font-weight:600;line-height:1.06;letter-spacing:-.035em;overflow-wrap:anywhere;margin:0}.small{font-size:26px;line-height:1.4}.fine{font-size:19px;line-height:1.4;letter-spacing:.035em}h2,p{margin:0}
.artwork{position:absolute;inset:0;display:flex;align-items:flex-end;padding:8%}.nameplate{width:min(100%,1020px);position:relative;display:flex;gap:30px;align-items:center;background:var(--cardColor);color:var(--cardText);padding:40px 46px;border-radius:8px;border-left:12px solid var(--accentColor)}.portrait{width:138px;height:138px;flex:0 0 138px;border-radius:50%;overflow:hidden;background:var(--accentColor);display:grid;place-items:center}.portrait img{width:100%;height:100%;object-fit:cover}.initials{font-size:49px;font-weight:700;color:white}.copy{flex:1;min-width:0}.company{font-size:19px;color:var(--cardText);opacity:.7;margin-bottom:12px;letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere}.name{font-size:68px}.role{margin-top:14px;font-size:25px;line-height:1.3;opacity:.85;overflow-wrap:anywhere}.accent-line{height:4px;width:70px;background:var(--accentColor);margin-top:20px}#root.right .artwork{justify-content:flex-end}html:not([data-size=wide]) .nameplate{padding:32px;gap:22px}html:not([data-size=wide]) .portrait{width:105px;height:105px;flex-basis:105px}html:not([data-size=wide]) .name{font-size:58px}</style></head><body>
<div id="root" data-composition-id="speaker-nameplate" data-start="0" data-duration="6" data-duration-var="durationSeconds" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
<img id="background" class="background" data-var-src="backgroundImage" alt="">
<section id="speaker-nameplate-scene" class="scene clip" data-start="0" data-duration="6" data-duration-var="durationSeconds" data-track-index="1"><div class="artwork"><div class="nameplate"><div class="portrait"><span class="initials" data-var-text="initials">YN</span><img id="portrait" data-var-src="portraitImage" alt="Speaker portrait"></div><div class="copy"><div class="company" data-var-text="company" data-optional="company">Your company</div><h1 class="heading name" data-var-text="speakerName">Your name</h1><div class="role" data-var-text="role" data-optional="role">Founder & creative director</div><div class="accent-line"></div></div></div></div></section></div>
<script>
const vars=window.__hyperframes?.getVariables?.() ?? window.__studio?.getVariables?.() ?? {};
const root=document.getElementById('root');
const defaults={"speakerName":"Your name","role":"Founder & creative director","company":"Your company","initials":"YN","portraitImage":"","alignment":"left","accentColor":"#2453ff","bgColor":"#F6F7F9","textColor":"#16181d","cardColor":"#16181d","cardText":"#F6F7F9"};
const value=id=>vars[id] ?? defaults[id] ?? '';
document.querySelectorAll('[data-var-text]').forEach(el=>{el.textContent=String(value(el.dataset.varText));});
for(const key of ['bgColor','textColor','accentColor','secondaryColor','cardColor','cardText'])if(value(key))root.style.setProperty('--'+key,value(key));
if(vars.headingFont)root.style.setProperty('--serif',vars.headingFont);
if(!String(vars.backgroundImage??'').trim())document.getElementById('background').remove();
document.querySelectorAll('[data-optional]').forEach(el=>{if(!String(value(el.dataset.optional)).trim())el.remove();});
if(value('alignment')==='right')root.classList.add('right');if(String(value('portraitImage')).trim())document.querySelector('.initials').remove();else document.getElementById('portrait').remove();
const total=Math.max(2,Math.min(120,Number(vars.durationSeconds)||6));
const enter=Math.min(total*.45,Math.max(.2,Number(vars.entranceSeconds)||1.4));
const exit=Math.min(total*.45,Math.max(0,Number(vars.exitSeconds)||0));
root.dataset.posterTime=String(total-exit-.05);
const tl=gsap.timeline({paused:true});
tl.from('.nameplate',{x:-55,opacity:0,duration:.65,ease:'power3.out'},0).from('.portrait',{scale:.8,opacity:0,duration:.5,ease:'back.out(1.2)'},.18).from('.copy',{y:16,opacity:0,duration:.5,ease:'power2.out'},.3).from('.accent-line',{scaleX:0,transformOrigin:'left center',duration:.45,ease:'power2.out'},.55);
const original=tl.duration();
tl.getChildren().forEach(t=>{t.startTime(t.startTime()*enter/original);t.duration(t.duration()*enter/original);});
if(exit)tl.to('.artwork',{opacity:0,y:-12,duration:exit,ease:'power2.in'},total-exit);
tl.to({},{duration:.001},total-.001);
window.__timelines=window.__timelines||{};window.__timelines['speaker-nameplate']=tl;
</script></body></html>
