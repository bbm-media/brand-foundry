<!doctype html>
<!--
  STARTER TEMPLATE · video / overlays
  Motion templates follow the HyperFrames contract:
    · one gsap.timeline({paused:true}) registered on window.__timelines[compositionId]
    · seek-safe: animate transforms/opacity only, never Math.random()/Date.now()
    · data-duration on #root sets the render length
  Set bgColor to "transparent" (the transparent MOV export does this for you) to
  render an overlay that floats over footage.
-->
<html data-brand-fonts
  lang="en"
  data-composition-variables='[{"id": "secondaryColor", "brandKey": "accentSoft", "type": "color", "label": "Secondary", "default": "#5C7CFF"}, {"id": "line1", "type": "string", "label": "Line 1", "default": "Your headline"}, {"id": "line2", "type": "string", "label": "Line 2 (blank hides)", "default": "lands right here"}, {"id": "caption", "type": "string", "label": "Caption (blank hides)", "default": "Supporting line"}, {"id": "backgroundImage", "type": "string", "label": "Background image or gradient (optional)", "default": ""}, {"id": "backgroundFit", "type": "enum", "label": "Background fit", "default": "cover", "options": [{"value": "cover", "label": "Cover"}, {"value": "contain", "label": "Contain"}, {"value": "fill", "label": "Stretch"}]}, {"id": "backgroundPosition", "type": "enum", "label": "Background position", "default": "center", "options": [{"value": "center", "label": "Center"}, {"value": "top", "label": "Top"}, {"value": "bottom", "label": "Bottom"}]}, {"id": "backgroundTreatment", "type": "enum", "label": "Readability wash", "default": "none", "options": [{"value": "none", "label": "None"}, {"value": "light", "label": "Light"}, {"value": "dark", "label": "Dark"}]}, {"id": "gridOpacity", "type": "number", "label": "Grid opacity", "default": 1, "min": 0, "max": 1, "step": 0.1, "group": "Background"}, {"id": "bgColor", "brandKey": "paper", "type": "color", "label": "Background", "default": "#F6F7F9"}, {"id": "textColor", "brandKey": "ink", "type": "color", "label": "Text", "default": "#16181D"}, {"id": "accentColor", "brandKey": "accent", "type": "color", "label": "Accent", "default": "#2453FF"}, {"id": "durationSeconds", "type": "number", "group": "Timing", "label": "Total seconds", "default": 4, "min": 2, "max": 120, "step": 0.5}, {"id": "entranceSeconds", "type": "number", "group": "Timing", "label": "Entrance seconds", "default": 1.5, "min": 0.2, "max": 10, "step": 0.1}, {"id": "exitSeconds", "type": "number", "group": "Timing", "label": "Exit seconds (0 holds the last frame)", "default": 0, "min": 0, "max": 10, "step": 0.1}, {"id": "headingFont", "type": "font", "group": "Brand", "label": "Heading font", "default": "", "description": "Inherit brand, or choose an installed system font."}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <title>Starter Headline {{LABEL}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Lora:wght@600&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; }
      :root { --serif: "Lora", Georgia, serif; --sans: "Inter", Arial, sans-serif; }
      #root {
        position: relative; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden;
        background: var(--bgColor); color: var(--textColor); font-family: var(--sans);
      }
      .background, .background-wash { position: absolute; inset: 0; display: none; }
      .background { width: 100%; height: 100%; object-fit: var(--backgroundFit, cover); object-position: var(--backgroundPosition, center); }
      #root.has-bg .background, #root.has-bg .background-wash { display: block; }
      #root.wash-light .background-wash { background: rgba(246,247,249,.72); }
      #root.wash-dark .background-wash { background: rgba(13,14,17,.64); }
      /* gridOpacity is set to 0 by the transparent export so the grid drops out. */
      #root::before {
        content: ""; position: absolute; inset: 0; opacity: var(--gridOpacity, 1);
        background-image: linear-gradient(rgba(22,24,29,0.05) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(22,24,29,0.05) 1px, transparent 1px);
        background-size: 54px 54px; z-index: 1;
      }
      .stage { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 26px; padding: 80px; box-sizing: border-box; z-index: 2; }
      .line { font-family: var(--serif); font-weight: 600; font-size: 96px; line-height: 1.06;
        letter-spacing: -0.02em; text-align: center; }
      .rule { width: 120px; height: 10px; border-radius: 5px; background: var(--accentColor); }
      .caption { font-weight: 700; font-size: 40px; text-align: center;
        color: color-mix(in srgb, var(--textColor) 70%, transparent); }
      html[data-size="half"] .line { font-size: 72px; }
      html[data-size="wide"] .line { font-size: 88px; }
    .rule { background: linear-gradient(90deg,var(--accentColor),var(--secondaryColor)); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="starter-headline" data-start="0"
         data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-duration="4" data-duration-var="durationSeconds">
      <img class="background" id="background" data-var-src="backgroundImage" alt="" />
      <div class="background-wash"></div>
      <section id="headline-stage" class="stage clip" data-start="0" data-duration="4" data-duration-var="durationSeconds" data-track-index="1">
        <div class="line" id="l1" data-var-text="line1">Your headline</div>
        <div class="rule" id="rule"></div>
        <div class="line" id="l2" data-var-text="line2">lands right here</div>
        <div class="caption" id="cap" data-var-text="caption">Supporting line</div>
      </section>
    </div>
    <script>
      const vars = window.__hyperframes?.getVariables?.() ?? window.__studio?.getVariables?.() ?? {};
      const root = document.getElementById("root");
      const bg = String(vars.backgroundImage ?? "").trim();
      if (bg && !/placeholder/.test(bg)) {
        root.classList.add("has-bg");
        if (["light", "dark"].includes(vars.backgroundTreatment)) root.classList.add(`wash-${vars.backgroundTreatment}`);
      } else document.getElementById("background")?.remove();
      for (const [id, key] of [["l2", "line2"], ["cap", "caption"]])
        if (String(vars[key] ?? "").trim() === "") document.getElementById(id).remove();

      const total = Math.max(2, Math.min(120, Number(vars.durationSeconds) || 4));
      const enter = Math.min(total * .45, Math.max(.2, Number(vars.entranceSeconds) || 1.5));
      const exit = Math.min(total * .45, Math.max(0, Number(vars.exitSeconds) || 0));
      if (vars.headingFont) root.style.setProperty('--serif', vars.headingFont);
      root.dataset.posterTime = String(total - exit - .05);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#l1", { y: 50, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.15)
        .from("#rule", { scaleX: 0, transformOrigin: "50% 50%", duration: 0.45, ease: "power3.out" }, 0.5);
      if (document.getElementById("l2"))
        tl.from("#l2", { y: 50, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.7);
      if (document.getElementById("cap"))
        tl.from("#cap", { y: 26, opacity: 0, duration: 0.5, ease: "power3.out" }, 1.05);
      // Scale the entrance, then hold. Exit animates the parent, avoiding tween conflicts.
      const original = tl.duration();
      tl.getChildren().forEach(tween => { tween.startTime(tween.startTime() * enter / original); tween.duration(tween.duration() * enter / original); });
      if (exit) tl.to('.stage', { opacity: 0, duration: exit, ease: 'none' }, total - exit);
      tl.to({}, { duration: .001 }, total - .001);
      window.__timelines["starter-headline"] = tl;
    </script>
  </body>
</html>
