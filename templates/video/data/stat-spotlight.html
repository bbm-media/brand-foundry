<!doctype html>
<html lang="en" data-brand-fonts data-composition-variables='[{"id":"eyebrow","type":"string","label":"Category","default":"THE PAYOFF","group":"Content"},{"id":"headline","type":"string","label":"Headline","default":"More time for the work that matters.","group":"Content"},{"id":"statValue","type":"number","label":"Featured number","group":"Content","default":24,"min":0,"max":999999,"step":1,"description":"The result you want to highlight. Replace this example with your own verified number."},{"id":"unit","type":"string","label":"Unit","default":"h","group":"Content","description":"A short suffix such as h, %, x or nothing."},{"id":"statLabel","type":"string","label":"What the number means","default":"Saved per production cycle","group":"Content"},{"id":"footnote","type":"string","label":"Source or disclaimer","default":"EXAMPLE DATA / REPLACE WITH YOUR RESULTS","group":"Content"},{"id":"accentColor","type":"color","label":"Accent","default":"#2453ff","brandKey":"accent","group":"Brand"},{"id":"secondaryColor","type":"color","label":"Secondary","default":"#5c7cff","brandKey":"accentSoft","group":"Brand"},{"id":"bgColor","type":"color","label":"Background","default":"#F6F7F9","brandKey":"paper","group":"Brand"},{"id":"textColor","type":"color","label":"Text","default":"#16181d","brandKey":"ink","group":"Brand"},{"id":"backgroundImage","type":"string","label":"Background image","default":"","group":"Background","description":"Optional image behind the graphic. Leave blank for the solid background."},{"id":"durationSeconds","type":"number","label":"Video length (seconds)","group":"Timing","default":5,"min":2,"max":120,"step":0.5},{"id":"entranceSeconds","type":"number","label":"Animate in (seconds)","group":"Timing","default":1.4,"min":0.2,"max":10,"step":0.1},{"id":"exitSeconds","type":"number","label":"Animate out (seconds)","group":"Timing","default":0.5,"min":0,"max":10,"step":0.1},{"id":"headingFont","type":"font","label":"Heading font","group":"Brand","default":"","description":"Use the studio heading font, or choose another font for this asset."}]'>
<head><meta charset="utf-8"><meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}"><title>Stat Spotlight {{LABEL}}</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0}#root{position:relative;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;background:var(--bgColor);color:var(--textColor);font-family:var(--sans,Arial,sans-serif)}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.2}.scene{position:absolute;inset:0}.eyebrow{font-size:22px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.heading{font-family:var(--serif,Georgia,serif);font-weight:600;line-height:1.06;letter-spacing:-.035em;overflow-wrap:anywhere;margin:0}.small{font-size:26px;line-height:1.4}.fine{font-size:19px;line-height:1.4;letter-spacing:.035em}h2,p{margin:0}
.artwork{position:absolute;inset:0;padding:7%;display:flex;flex-direction:column;justify-content:center;gap:48px}.eyebrow{color:var(--accentColor)}.stat-body{display:flex;flex-direction:column;align-items:center;gap:62px}.intro{width:100%}.heading{font-size:80px;max-width:940px;margin-top:26px}.number-block{width:460px;height:460px;flex:0 0 460px;position:relative;display:grid;place-items:center}.number-block svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.ring-track{fill:none;stroke:var(--textColor);stroke-opacity:.1;stroke-width:8}.ring-progress{fill:none;stroke:var(--accentColor);stroke-width:12;stroke-linecap:round;stroke-dasharray:1319.469;stroke-dashoffset:0}.figure{display:flex;align-items:baseline;justify-content:center;gap:8px;max-width:380px}.number{font-size:180px;letter-spacing:-.07em;font-weight:700;line-height:1}.unit{font-size:66px;letter-spacing:-.04em;color:var(--accentColor);font-weight:600}.stat-label{font-size:32px;text-align:center;max-width:700px;line-height:1.3}.stat-footer{border-top:2px solid var(--accentColor);padding-top:20px;font-size:19px;opacity:.7;overflow-wrap:anywhere}html[data-size=wide] .stat-body{flex-direction:row;justify-content:space-between;gap:70px}html[data-size=wide] .intro{max-width:760px}html[data-size=wide] .heading{font-size:88px}html[data-size=wide] .stat-label{text-align:left}html[data-size=half] .artwork{gap:32px}html[data-size=half] .stat-body{gap:38px}html[data-size=half] .heading{font-size:68px}</style></head><body>
<div id="root" data-composition-id="stat-spotlight" data-start="0" data-duration="5" data-duration-var="durationSeconds" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
<img id="background" class="background" data-var-src="backgroundImage" alt="">
<section id="stat-spotlight-scene" class="scene clip" data-start="0" data-duration="5" data-duration-var="durationSeconds" data-track-index="1"><div class="artwork"><div class="stat-body"><div class="intro"><div class="eyebrow" data-var-text="eyebrow" data-optional="eyebrow">THE PAYOFF</div><h1 class="heading" data-var-text="headline">More time for the work that matters.</h1></div><div class="number-block"><svg viewBox="0 0 460 460" aria-hidden="true"><circle class="ring-track" cx="230" cy="230" r="210"/><circle class="ring-progress" cx="230" cy="230" r="210" transform="rotate(-90 230 230)"/></svg><div class="figure"><span class="number" id="number"></span><span class="unit" data-var-text="unit" data-optional="unit">h</span></div></div></div><div class="stat-label" data-var-text="statLabel" data-optional="statLabel">Saved per production cycle</div><div class="stat-footer fine" data-var-text="footnote" data-optional="footnote">EXAMPLE DATA / REPLACE WITH YOUR RESULTS</div></div></section></div>
<script>
const vars=window.__hyperframes?.getVariables?.() ?? window.__studio?.getVariables?.() ?? {};
const root=document.getElementById('root');
const defaults={"eyebrow":"THE PAYOFF","headline":"More time for the work that matters.","statValue":24,"unit":"h","statLabel":"Saved per production cycle","footnote":"EXAMPLE DATA / REPLACE WITH YOUR RESULTS","accentColor":"#2453ff","secondaryColor":"#5c7cff","bgColor":"#F6F7F9","textColor":"#16181d"};
const value=id=>vars[id] ?? defaults[id] ?? '';
document.querySelectorAll('[data-var-text]').forEach(el=>{el.textContent=String(value(el.dataset.varText));});
for(const key of ['bgColor','textColor','accentColor','secondaryColor','cardColor','cardText'])if(value(key))root.style.setProperty('--'+key,value(key));
if(vars.headingFont)root.style.setProperty('--serif',vars.headingFont);
if(!String(vars.backgroundImage??'').trim())document.getElementById('background').remove();
document.querySelectorAll('[data-optional]').forEach(el=>{if(!String(value(el.dataset.optional)).trim())el.remove();});
const n=Math.max(0,Math.min(999999,Number(value('statValue'))||0));document.getElementById('number').textContent=n.toLocaleString('en-US');if(n>=1000)document.getElementById('number').style.fontSize=n>=100000?'82px':'112px';
const total=Math.max(2,Math.min(120,Number(vars.durationSeconds)||5));
const enter=Math.min(total*.45,Math.max(.2,Number(vars.entranceSeconds)||1.4));
const exit=Math.min(total*.45,Math.max(0,Number(vars.exitSeconds)||0));
root.dataset.posterTime=String(total-exit-.05);
const tl=gsap.timeline({paused:true});
tl.from('.intro',{y:30,opacity:0,duration:.65,ease:'power3.out'},0).from('.ring-progress',{strokeDashoffset:1319.469,duration:1.1,ease:'power2.inOut'},.1).from('.figure',{scale:.85,opacity:0,duration:.65,ease:'power3.out'},.3).from('.stat-label',{y:18,opacity:0,duration:.45,ease:'power2.out'},.65);if(document.querySelector('.stat-footer'))tl.from('.stat-footer',{opacity:0,duration:.35},.9);
const original=tl.duration();
tl.getChildren().forEach(t=>{t.startTime(t.startTime()*enter/original);t.duration(t.duration()*enter/original);});
if(exit)tl.to('.artwork',{opacity:0,y:-12,duration:exit,ease:'power2.in'},total-exit);
tl.to({},{duration:.001},total-.001);
window.__timelines=window.__timelines||{};window.__timelines['stat-spotlight']=tl;
</script></body></html>
